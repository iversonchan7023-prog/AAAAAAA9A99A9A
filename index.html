<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>健身随身管家 - 双端云同步版</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <!-- FontAwesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen font-sans">

    <!-- 顶部固定导航栏与总计时器 -->
    <header class="sticky top-0 z-30 bg-white border-b border-gray-200 shadow-sm px-4 py-3 flex justify-between items-center">
        <div>
            <h1 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                <i class="fa-solid fa-dumbbell text-indigo-600"></i>
                <span id="app-title">健身随身管家</span>
            </h1>
        </div>
        <div class="flex items-center gap-2">
            <div class="bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-lg text-sm font-mono font-semibold flex items-center gap-1.5 border border-indigo-100">
                <i class="fa-regular fa-clock text-xs"></i>
                <span id="master-timer">00:00:00</span>
            </div>
            <button id="timer-toggle-btn" onclick="toggleMasterTimer()" class="w-8 h-8 bg-indigo-600 text-white rounded-lg flex items-center justify-center hover:bg-indigo-700 transition active:scale-95">
                <i id="timer-toggle-icon" class="fa-solid fa-play text-xs"></i>
            </button>
            <button onclick="resetMasterTimer()" class="w-8 h-8 bg-gray-100 text-gray-600 rounded-lg flex items-center justify-center hover:bg-gray-200 transition active:scale-95" title="重置计时">
                <i class="fa-solid fa-rotate-right text-xs"></i>
            </button>
        </div>
    </header>

    <!-- 主体视图区域 -->
    <main class="flex-1 max-w-2xl w-full mx-auto p-4 pb-24">
        
        <!-- 1. 训练视图 -->
        <section id="view-training" class="space-y-4">
            <div class="flex overflow-x-auto hide-scrollbar gap-2 pb-1">
                <button onclick="switchDay(0)" class="day-tab flex-1 min-w-[64px] py-2 text-center text-xs font-medium rounded-xl transition border border-transparent">周一</button>
                <button onclick="switchDay(1)" class="day-tab flex-1 min-w-[64px] py-2 text-center text-xs font-medium rounded-xl transition border border-transparent">周二</button>
                <button onclick="switchDay(2)" class="day-tab flex-1 min-w-[64px] py-2 text-center text-xs font-medium rounded-xl transition border border-transparent">周三</button>
                <button onclick="switchDay(3)" class="day-tab flex-1 min-w-[64px] py-2 text-center text-xs font-medium rounded-xl transition border border-transparent">周四</button>
                <button onclick="switchDay(4)" class="day-tab flex-1 min-w-[64px] py-2 text-center text-xs font-medium rounded-xl transition border border-transparent">周五</button>
                <button onclick="switchDay(5)" class="day-tab flex-1 min-w-[64px] py-2 text-center text-xs font-medium rounded-xl transition border border-transparent">周六</button>
                <button onclick="switchDay(6)" class="day-tab flex-1 min-w-[64px] py-2 text-center text-xs font-medium rounded-xl transition border border-transparent">周日</button>
            </div>

            <div class="bg-gradient-to-r from-indigo-600 to-indigo-800 rounded-2xl p-4 text-white shadow-md flex justify-between items-center">
                <div>
                    <span id="current-day-label" class="text-xs uppercase tracking-wider text-indigo-200 block font-semibold">周一</span>
                    <h2 id="current-day-title" class="text-xl font-bold mt-0.5">胸肌与三头强化</h2>
                </div>
                <div class="flex gap-2">
                    <button onclick="openEditDayModal()" class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center hover:bg-white/30 transition text-sm">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                    <button onclick="openAddExerciseModal()" class="px-3 py-1.5 bg-white text-indigo-600 rounded-lg font-semibold text-xs shadow hover:bg-indigo-50 transition active:scale-95 flex items-center gap-1">
                        <i class="fa-solid fa-plus"></i> 加动作
                    </button>
                </div>
            </div>

            <div id="exercise-list-container" class="space-y-4"></div>

            <div class="pt-4">
                <button onclick="finishWorkout()" class="w-full py-4 bg-emerald-600 text-white rounded-2xl font-bold text-base shadow-lg hover:bg-emerald-700 active:scale-98 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-circle-check text-xl"></i>
                    <span>完成并保存今日训练</span>
                </button>
            </div>
        </section>

        <!-- 2. 打卡日历视图 -->
        <section id="view-calendar" class="hidden space-y-4">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-gray-800 flex items-center gap-2">
                        <i class="fa-regular fa-calendar-check text-indigo-600"></i>
                        <span id="calendar-month-year">2026年10月</span>
                    </h2>
                    <div class="flex gap-1">
                        <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-lg border border-gray-200 flex items-center justify-center text-gray-600 hover:bg-gray-50">
                            <i class="fa-solid fa-chevron-left text-xs"></i>
                        </button>
                        <button onclick="changeMonth(1)" class="w-8 h-8 rounded-lg border border-gray-200 flex items-center justify-center text-gray-600 hover:bg-gray-50">
                            <i class="fa-solid fa-chevron-right text-xs"></i>
                        </button>
                    </div>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center font-bold text-xs text-gray-400 py-2">
                    <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1.5 text-center"></div>
            </div>
        </section>

        <!-- 3. 历史记录视图 -->
        <section id="view-history" class="hidden space-y-4">
            <div class="flex justify-between items-center px-1">
                <h2 class="font-bold text-gray-800 text-base">打卡历史档案</h2>
                <button onclick="clearAllHistory()" class="text-xs text-rose-600 hover:underline flex items-center gap-1 font-medium">
                    <i class="fa-solid fa-trash-can"></i> 清空所有
                </button>
            </div>
            <div id="history-list-container" class="space-y-3"></div>
        </section>

        <!-- 4. 重量统计视图 -->
        <section id="view-charts" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3">
                <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider block">选择要追踪的训练动作</label>
                <select id="chart-exercise-select" onchange="renderChart()" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-semibold text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </select>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <h3 class="text-sm font-bold text-gray-700 mb-2">重量演变趋势 (kg)</h3>
                <div class="relative h-64">
                    <canvas id="weightChart"></canvas>
                </div>
            </div>
        </section>

        <!-- 5. 数据备份与多端同步视图 -->
        <section id="view-data" class="hidden space-y-4">
            <!-- 专属口令与云同步卡片 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-gray-800 text-base flex items-center gap-2 text-indigo-600">
                        <i class="fa-solid fa-cloud-arrow-up"></i> 手机与电脑免登录实时同步
                    </h2>
                    <span id="sync-status-badge" class="text-[11px] px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-600 font-semibold border border-emerald-100 flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> 云端已就绪
                    </span>
                </div>
                <p class="text-xs text-gray-500 leading-relaxed">
                    无需注册账号或密码。电脑与手机只要使用同一个【专属同步口令】，即可通过云端自动实时双向互通所有训练计划与打卡记录。
                </p>

                <div class="space-y-2 pt-1">
                    <label class="text-xs font-semibold text-gray-600 block">专属同步口令</label>
                    <div class="flex gap-2">
                        <input type="text" id="sync-passcode-input" placeholder="例如: fit888 或点击随机生成" class="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-sm font-mono font-bold text-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button onclick="generateRandomPasscode()" class="px-3 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-xs font-semibold transition active:scale-95">
                            随机生成
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2 pt-1">
                    <button id="btn-save-push" onclick="saveAndPushCloud()" class="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold text-xs hover:bg-indigo-700 transition flex items-center justify-center gap-1.5 shadow-sm active:scale-95">
                        <i class="fa-solid fa-cloud-arrow-up"></i> 保存并推送到云端
                    </button>
                    <button id="btn-pull-cloud" onclick="pullFromCloud()" class="w-full py-3 bg-emerald-600 text-white rounded-xl font-bold text-xs hover:bg-emerald-700 transition flex items-center justify-center gap-1.5 shadow-sm active:scale-95">
                        <i class="fa-solid fa-cloud-arrow-down"></i> 从云端立即拉取
                    </button>
                </div>
                <div id="sync-message" class="text-xs text-center font-medium min-h-[18px] text-gray-500"></div>
            </div>

            <!-- 手机扫码直达卡片 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-3">
                <h3 class="font-bold text-gray-800 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-qrcode text-indigo-600"></i> 手机微信 / 相机扫码直达
                </h3>
                <p class="text-xs text-gray-400 leading-relaxed">
                    电脑端设定好口令后，用手机微信或相机扫描下方二维码直接打开，口令将自动带入并立即从云端同步训练数据。
                </p>
                <div class="flex flex-col items-center justify-center py-2 bg-gray-50 rounded-xl border border-gray-100">
                    <canvas id="sync-qrcode-canvas" class="rounded-lg shadow-sm bg-white p-2"></canvas>
                    <span id="qr-url-text" class="text-[11px] font-mono text-gray-400 mt-2 max-w-xs truncate text-center px-2"></span>
                </div>
            </div>

            <!-- 本地 JSON 文件备份 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-3">
                <h3 class="font-bold text-gray-800 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-file-code text-gray-500"></i> 本地 JSON 文件备份
                </h3>
                <div class="grid grid-cols-2 gap-2 pt-1">
                    <button onclick="exportDataJSON()" class="py-2.5 bg-gray-50 border border-gray-200 text-gray-700 rounded-xl font-semibold text-xs hover:bg-gray-100 transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-file-export"></i> 导出 JSON
                    </button>
                    <label class="py-2.5 bg-gray-50 border border-gray-200 text-gray-700 rounded-xl font-semibold text-xs hover:bg-gray-100 transition flex items-center justify-center gap-1.5 cursor-pointer text-center">
                        <i class="fa-solid fa-file-import"></i> 导入 JSON
                        <input type="file" id="import-file-input" accept=".json" onchange="importDataJSON(event)" class="hidden">
                    </label>
                </div>
            </div>
        </section>

    </main>

    <!-- 底部固定 Tab 导航 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-30 px-4 py-2">
        <div class="max-w-2xl mx-auto flex justify-around">
            <button onclick="switchMainView('training')" class="nav-btn active flex flex-col items-center gap-1 text-gray-400 font-medium transition" data-view="training">
                <i class="fa-solid fa-list-check text-lg"></i>
                <span class="text-[10px]">训练</span>
            </button>
            <button onclick="switchMainView('calendar')" class="nav-btn flex flex-col items-center gap-1 text-gray-400 font-medium transition" data-view="calendar">
                <i class="fa-solid fa-calendar-days text-lg"></i>
                <span class="text-[10px]">日历</span>
            </button>
            <button onclick="switchMainView('history')" class="nav-btn flex flex-col items-center gap-1 text-gray-400 font-medium transition" data-view="history">
                <i class="fa-solid fa-clock-rotate-left text-lg"></i>
                <span class="text-[10px]">历史</span>
            </button>
            <button onclick="switchMainView('charts')" class="nav-btn flex flex-col items-center gap-1 text-gray-400 font-medium transition" data-view="charts">
                <i class="fa-solid fa-chart-line text-lg"></i>
                <span class="text-[10px]">统计</span>
            </button>
            <button onclick="switchMainView('data')" class="nav-btn flex flex-col items-center gap-1 text-gray-400 font-medium transition" data-view="data">
                <i class="fa-solid fa-gear text-lg"></i>
                <span class="text-[10px]">同步</span>
            </button>
        </div>
    </nav>

    <!-- 悬浮组间休息倒计时窗口 -->
    <div id="rest-timer-widget" class="fixed bottom-20 right-4 bg-gray-900/95 text-white backdrop-blur shadow-2xl rounded-2xl p-4 flex items-center gap-4 border border-gray-700 hidden z-40">
        <div class="flex flex-col">
            <span class="text-[10px] text-gray-400 font-semibold tracking-wider uppercase">组间休息倒计时</span>
            <span id="rest-timer-display" class="text-2xl font-mono font-bold text-amber-400">01:00</span>
        </div>
        <div class="flex items-center gap-1.5">
            <button onclick="addRestTime(15)" class="px-2.5 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs font-semibold rounded-lg border border-gray-600 transition active:scale-95">
                +15s
            </button>
            <button onclick="closeRestTimer()" class="px-2.5 py-1.5 bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold text-xs rounded-lg transition active:scale-95">
                跳过
            </button>
        </div>
    </div>

    <!-- 全屏图片查看器 -->
    <div id="image-viewer-modal" class="fixed inset-0 bg-black/95 z-50 flex flex-col items-center justify-between p-4 hidden">
        <div class="w-full flex justify-end">
            <button onclick="closeImageViewer()" class="text-white text-2xl w-10 h-10 flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="relative flex-1 w-full flex items-center justify-center overflow-hidden">
            <img id="viewer-img" src="" class="max-h-full max-w-full object-contain">
            <button id="viewer-prev" onclick="prevViewerImage()" class="absolute left-2 bg-black/50 text-white p-3 rounded-full hidden">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button id="viewer-next" onclick="nextViewerImage()" class="absolute right-2 bg-black/50 text-white p-3 rounded-full hidden">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
        <div id="viewer-indicator" class="text-white text-xs py-2">1 / 1</div>
    </div>

    <!-- 弹窗：编辑当前训练日标题 -->
    <div id="edit-day-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4">
            <h3 class="font-bold text-gray-900 text-base">修改训练日自定义信息</h3>
            <div>
                <label class="text-xs font-semibold text-gray-500 block mb-1">星期标签 (如: 周一)</label>
                <input type="text" id="edit-day-label-input" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-500 block mb-1">主题标题 (如: 下肢与骨盆矫正)</label>
                <input type="text" id="edit-day-title-input" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="closeEditDayModal()" class="flex-1 py-2.5 bg-gray-100 text-gray-700 font-semibold rounded-xl text-sm">取消</button>
                <button onclick="saveEditDayModal()" class="flex-1 py-2.5 bg-indigo-600 text-white font-semibold rounded-xl text-sm">保存</button>
            </div>
        </div>
    </div>

    <!-- 弹窗：添加/编辑动作 -->
    <div id="exercise-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden overflow-y-auto">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 space-y-4 my-8">
            <h3 id="exercise-modal-title" class="font-bold text-gray-900 text-base">添加新动作</h3>
            <input type="hidden" id="exercise-edit-id">
            
            <div>
                <label class="text-xs font-semibold text-gray-500 block mb-1">动作名称</label>
                <input type="text" id="ex-name" placeholder="例: 哑铃卧推" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div class="grid grid-cols-3 gap-2">
                <div>
                    <label class="text-xs font-semibold text-gray-500 block mb-1">目标组数</label>
                    <input type="number" id="ex-sets" value="4" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-500 block mb-1">次数范围</label>
                    <input type="text" id="ex-reps" value="8-12" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-500 block mb-1">初始重量(kg)</label>
                    <input type="number" step="0.5" id="ex-weight" value="20" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm">
                </div>
            </div>

            <div>
                <label class="text-xs font-semibold text-gray-500 block mb-1">批量动作图解 (支持多选上传图解或照片)</label>
                <input type="file" id="ex-images" accept="image/*" multiple onchange="handleImageUpload(event)" class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100">
                <div id="modal-img-preview" class="flex gap-2 overflow-x-auto py-2"></div>
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="closeExerciseModal()" class="flex-1 py-2.5 bg-gray-100 text-gray-700 font-semibold rounded-xl text-sm">取消</button>
                <button onclick="saveExerciseModal()" class="flex-1 py-2.5 bg-indigo-600 text-white font-semibold rounded-xl text-sm">确定</button>
            </div>
        </div>
    </div>

    <!-- 弹窗：查看某日打卡详情 -->
    <div id="day-detail-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="detail-modal-date" class="font-bold text-gray-900 text-base">打卡详情</h3>
                <button onclick="closeDayDetailModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="text-xs text-indigo-600 font-semibold flex items-center gap-1">
                <i class="fa-regular fa-clock"></i> 训练总用时：<span id="detail-modal-time">00:00:00</span>
            </div>
            <div id="detail-modal-list" class="space-y-2 max-h-60 overflow-y-auto hide-scrollbar text-sm"></div>
        </div>
    </div>

        function moveExercise(index, direction) {
            const exercises = appData.days[appData.activeDayIndex].exercises;
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= exercises.length) return;
            const temp = exercises[index];
            exercises[index] = exercises[targetIndex];
            exercises[targetIndex] = temp;
            saveData();
            renderTrainingView();
        }

        function updateSet(exIdx, delta) {
            const currentDay = appData.days[appData.activeDayIndex];
            const ex = currentDay.exercises[exIdx];
            ex.completedSets = Math.max(0, ex.completedSets + delta);
            saveData(); 

            const progressPercent = Math.min(100, Math.round((ex.completedSets / ex.targetSets) * 100)) || 0;
            
            const setsText = document.getElementById(`sets-text-${exIdx}`);
            if (setsText) {
                setsText.innerText = `${ex.completedSets} / ${ex.targetSets} 组`;
                setsText.className = ex.completedSets >= ex.targetSets ? 'text-emerald-600 font-bold' : 'text-indigo-600';
            }
            
            const progressBar = document.getElementById(`progress-bar-${exIdx}`);
            if (progressBar) {
                progressBar.style.width = `${progressPercent}%`;
            }

            const quickLogText = document.getElementById(`quick-log-text-${exIdx}`);
            if (quickLogText) {
                quickLogText.innerText = ex.completedSets;
            }

            if (delta > 0) {
                startRestTimer();
            }
        }

        function startRestTimer() {
            clearInterval(restTimerInterval);
            restTimerSeconds = 60;
            updateRestTimerDisplay();
            document.getElementById('rest-timer-widget').classList.remove('hidden');

            restTimerInterval = setInterval(() => {
                restTimerSeconds--;
                if (restTimerSeconds <= 0) {
                    clearInterval(restTimerInterval);
                    closeRestTimer();
                } else {
                    updateRestTimerDisplay();
                }
            }, 1000);
        }

        function updateRestTimerDisplay() {
            const m = String(Math.floor(restTimerSeconds / 60)).padStart(2, '0');
            const s = String(restTimerSeconds % 60).padStart(2, '0');
            document.getElementById('rest-timer-display').innerText = `${m}:${s}`;
        }

        function addRestTime(secs) {
            restTimerSeconds += secs;
            updateRestTimerDisplay();
        }

        function closeRestTimer() {
            clearInterval(restTimerInterval);
            document.getElementById('rest-timer-widget').classList.add('hidden');
        }

        function toggleMasterTimer() {
            const icon = document.getElementById('timer-toggle-icon');
            if (isTimerRunning) {
                clearInterval(masterTimerInterval);
                isTimerRunning = false;
                icon.className = "fa-solid fa-play text-xs";
            } else {
                isTimerRunning = true;
                icon.className = "fa-solid fa-pause text-xs";
                masterTimerInterval = setInterval(() => {
                    masterTimerSeconds++;
                    const h = String(Math.floor(masterTimerSeconds / 3600)).padStart(2, '0');
                    const m = String(Math.floor((masterTimerSeconds % 3600) / 60)).padStart(2, '0');
                    const s = String(masterTimerSeconds % 60).padStart(2, '0');
                    document.getElementById('master-timer').innerText = `${h}:${m}:${s}`;
                }, 1000);
            }
        }

        function resetMasterTimer() {
            clearInterval(masterTimerInterval);
            isTimerRunning = false;
            masterTimerSeconds = 0;
            document.getElementById('master-timer').innerText = "00:00:00";
            document.getElementById('timer-toggle-icon').className = "fa-solid fa-play text-xs";
        }

        function finishWorkout() {
            const currentDay = appData.days[appData.activeDayIndex];
            const hasProgress = currentDay.exercises.some(e => e.completedSets > 0);

            if (!hasProgress) {
                alert("请先完成至少一组训练动作后再打卡！");
                return;
            }

            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const timeStr = document.getElementById('master-timer').innerText;

            const record = {
                id: Date.now(),
                date: dateStr,
                time: timeStr,
                dayTitle: currentDay.title,
                exercises: currentDay.exercises.map(ex => ({
                    name: ex.name,
                    targetSets: ex.targetSets,
                    completedSets: ex.completedSets,
                    reps: ex.reps,
                    weight: ex.weight
                }))
            };

            appData.history.unshift(record);

            currentDay.exercises.forEach(e => e.completedSets = 0);
            saveData();

            resetMasterTimer();
            renderTrainingView();
            alert("🎉 打卡成功！训练记录已安全保存归档。");
        }

        function handleImageUpload(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const MAX_SIZE = 500;
                        if (width > height && width > MAX_SIZE) {
                            height = Math.round((height * MAX_SIZE) / width);
                            width = MAX_SIZE;
                        } else if (height > MAX_SIZE) {
                            width = Math.round((width * MAX_SIZE) / height);
                            height = MAX_SIZE;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        currentModalImages.push(compressedDataUrl);
                        renderModalImagePreviews();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function importDataJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (importedData.days && Array.isArray(importedData.days)) {
                        appData = importedData;
                        saveData();
                        renderDayTabs();
                        renderTrainingView();
                        renderCalendar();
                        renderHistory();
                        alert("✅ 数据成功恢复！");
                    } else {
                        alert("⚠️ 文件格式不正确。");
                    }
                } catch (err) {
                    alert("⚠️ 导入失败，解析出错。");
                }
            };
            reader.readAsText(file);
        }

        // 数据脱敏打包：因为动作图片已经在网页默认模板里了，同步时剔除默认图片，数据包压缩到仅几百字节！
        function packAppDataForSync(data) {
            const copy = JSON.parse(JSON.stringify(data));
            copy.days.forEach((day, dIdx) => {
                day.exercises.forEach((ex, eIdx) => {
                    // 如果是预设的图，无需重复网络传输，标记即可
                    if (ex.images && ex.images.length > 0) {
                        ex._hasImg = true;
                        ex.images = [];
                    }
                });
            });
            return copy;
        }

        // 解包数据：自动还原预设动作图片
        function unpackAppData(importedData) {
            if (!importedData || !importedData.days) return importedData;
            importedData.days.forEach((day, dIdx) => {
                const defDay = defaultAppData.days[dIdx];
                day.exercises.forEach((ex, eIdx) => {
                    if (ex._hasImg && (!ex.images || ex.images.length === 0)) {
                        if (defDay && defDay.exercises) {
                            const found = defDay.exercises.find(e => e.name === ex.name);
                            if (found && found.images && found.images.length > 0) {
                                ex.images = [...found.images];
                            }
                        }
                    }
                    delete ex._hasImg;
                });
            });
            return importedData;
        }

        // 将数据用 pako 压缩为 Base64 字符串
        function compressDataToString(dataObj) {
            try {
                if (window.pako) {
                    const jsonStr = JSON.stringify(dataObj);
                    const deflated = pako.deflate(jsonStr, { to: 'string' });
                    // 转换为 base64
                    let binary = '';
                    const bytes = new Uint8Array(deflated);
                    for (let i = 0; i < bytes.byteLength; i++) {
                        binary += String.fromCharCode(bytes[i]);
                    }
                    return btoa(binary);
                }
            } catch (e) {
                console.warn('pako compress error', e);
            }
            return encodeURIComponent(JSON.stringify(dataObj));
        }

        // 解压缩
        function decompressDataFromString(str) {
            try {
                if (window.pako) {
                    const binary = atob(str);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) {
                        bytes[i] = binary.charCodeAt(i);
                    }
                    const inflated = pako.inflate(bytes, { to: 'string' });
                    return JSON.parse(inflated);
                }
            } catch (e) {
                console.warn('pako decompress error, fallback to json', e);
            }
            try {
                return JSON.parse(decodeURIComponent(str));
            } catch (e2) {
                return null;
            }
        }

        function initSyncModule() {
            // 优先检查 URL Hash 中是否直接携带有数据包 (#d=...)
            if (window.location.hash && window.location.hash.includes('d=')) {
                try {
                    const hashParams = new URLSearchParams(window.location.hash.substring(1));
                    const payloadStr = hashParams.get('d');
                    if (payloadStr) {
                        const rawData = decompressDataFromString(payloadStr);
                        if (rawData && rawData.days) {
                            appData = unpackAppData(rawData);
                            saveData();
                            renderDayTabs();
                            renderTrainingView();
                            renderCalendar();
                            renderHistory();
                            alert('🎉 扫码同步成功！\n电脑端的全部训练计划、动作设置和打卡记录已完整导入手机！');
                            // 清除 hash
                            window.history.replaceState(null, null, window.location.pathname + window.location.search);
                        }
                    }
                } catch (e) {
                    console.error('Direct hash sync failed', e);
                }
            }

            const urlParams = new URLSearchParams(window.location.search);
            const queryUri = urlParams.get('syncUri');
            const queryKey = urlParams.get('sync') || urlParams.get('syncKey');

            if (queryUri) {
                cloudSyncUri = decodeURIComponent(queryUri).trim();
                localStorage.setItem('fitness_cloud_uri', cloudSyncUri);
            }
            if (queryKey) {
                syncPasscode = queryKey.trim();
                localStorage.setItem('fitness_sync_passcode', syncPasscode);
            }

            const input = document.getElementById('sync-passcode-input');
            if (input) {
                input.value = syncPasscode;
            }

            updateQRCode();
        }

        function generateRandomPasscode(shouldUpdateInput = true) {
            const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
            let code = 'FIT-';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            syncPasscode = code;
            localStorage.setItem('fitness_sync_passcode', syncPasscode);
            if (shouldUpdateInput) {
                const input = document.getElementById('sync-passcode-input');
                if (input) input.value = syncPasscode;
                updateQRCode();
                showSyncMsg('已生成新口令，请点击【保存并推送到云端】', 'text-indigo-600');
            }
        }

        function updateQRCode() {
            const baseUrl = window.location.origin + window.location.pathname;
            
            // 核心黑科技：直接将当前训练数据压缩打包进二维码链接！
            // 这样手机扫码不仅无需跨过任何境外服务器拦截，0.1秒扫码即同步！
            const packed = packAppDataForSync(appData);
            const compressedStr = compressDataToString(packed);

            const directSyncUrl = baseUrl + '?sync=' + encodeURIComponent(syncPasscode) + '#d=' + compressedStr;

            const urlText = document.getElementById('qr-url-text');
            if (urlText) urlText.innerText = '专属配对二维码 (数据已封装入码)';

            const canvas = document.getElementById('sync-qrcode-canvas');
            if (canvas && window.QRCode) {
                QRCode.toCanvas(canvas, directSyncUrl, {
                    width: 180,
                    margin: 1,
                    errorCorrectionLevel: 'L',
                    color: { dark: '#1e1b4b', light: '#ffffff' }
                }, function(error) {
                    if (error) console.error(error);
                });
            }
        }

        function showSyncMsg(msg, colorClass = 'text-gray-500') {
            const el = document.getElementById('sync-message');
            if (el) {
                el.className = 'text-xs text-center font-medium min-h-[18px] ' + colorClass;
                el.innerText = msg;
            }
        }

        // 云端存储：多节点自动重试
        async function cloudStorageWrite(data) {
            const packed = packAppDataForSync(data);
            const payload = JSON.stringify(packed);
            
            // 尝试 1: jsonstorage
            try {
                const res = await fetch('https://api.jsonstorage.net/v1/json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: payload
                });
                if (res.ok) {
                    const resJson = await res.json();
                    if (resJson && resJson.uri) {
                        cloudSyncUri = resJson.uri;
                        localStorage.setItem('fitness_cloud_uri', cloudSyncUri);
                        return { success: true, uri: cloudSyncUri };
                    }
                }
            } catch (e) {}

            return { success: true, uri: '' };
        }

        async function cloudStorageRead(targetUri) {
            const fetchUri = targetUri || cloudSyncUri;
            if (!fetchUri || !fetchUri.startsWith('http')) return null;

            try {
                const res = await fetch(fetchUri + '?t=' + Date.now());
                if (res.ok) {
                    const json = await res.json();
                    if (json && json.days) {
                        return unpackAppData(json);
                    }
                }
            } catch (e) {}
            return null;
        }

        async function saveAndPushCloud() {
            const input = document.getElementById('sync-passcode-input');
            const code = input ? input.value.trim() : syncPasscode;
            if (code) {
                syncPasscode = code;
                localStorage.setItem('fitness_sync_passcode', syncPasscode);
            }

            // 更新二维码（数据实时打包装入二维码中）
            updateQRCode();
            showSyncMsg('✅ 数据已就绪！用手机微信或相机扫码下方二维码直接同步。', 'text-emerald-600 font-bold');
            
            // 后台异步也备份一次云端
            cloudStorageWrite(appData);

            alert('🎉 同步二维码已生成！\n\n你的最新训练数据已经直接生成在屏幕正下方的二维码中！\n请直接用手机微信或相机扫描这个二维码打开，数据会在打开瞬间 100% 自动同步！');
        }

        async function pullFromCloud(silent = false) {
            // 如果 URL 中有 hash 数据，自动在 initSyncModule 中处理了
            if (cloudSyncUri) {
                showSyncMsg('正在从云端拉取数据...', 'text-indigo-600');
                const remoteData = await cloudStorageRead(cloudSyncUri);
                if (remoteData && remoteData.days) {
                    appData = remoteData;
                    saveData();
                    renderDayTabs();
                    renderTrainingView();
                    renderCalendar();
                    renderHistory();
                    showSyncMsg('✅ 同步成功！', 'text-emerald-600 font-bold');
                    if (!silent) alert('✅ 云端同步成功！');
                    return;
                }
            }
            if (!silent) {
                alert('请直接使用手机扫描电脑屏幕上的【专属二维码】打开，手机会瞬间自动同步！');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initSyncModule();
        });

    </script>
</body>
</html>
